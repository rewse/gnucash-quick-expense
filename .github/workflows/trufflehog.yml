name: TruffleHog

on:
  schedule:
    - cron: "13 19 * * 0"  # Every Monday at 04:13 JST (19:13 UTC Sun)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Secret Sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: rewse/actions/trufflehog@b9adb62fa1a195e38d32a54777a299111cc71d12  # v1.1.11
        with:
          extra-args: --results=verified,unknown
